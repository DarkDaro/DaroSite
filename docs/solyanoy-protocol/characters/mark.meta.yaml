signature_note: >-
  Подпись Марка стоит на протоколе совета и приказе на зачистку. Именно её
  ищет Кира. Он не отрицает подпись. Он отрицает, что подпись делает его
  убийцей.

psychology:
  core:
    - "Читает бумаги, проверяет подписи, переставляет стакан так, чтобы тот стоял параллельно краю."
    - "Ведущая потребность: чтобы его конструкция работала. Он хочет быть нужным не людям, а системе."
    - "Главный страх: потерять контроль и оказаться ненужным. Хаос для него хуже смерти."
    - "Стыд: он построил город, который не выдержал свободы."
    - "Считает допустимым дозирование, отбор, сокрытие, использование людей как элементов схемы."
    - "Не прощает публичного неподчинения и ошибок в расчётах."
  administrator: >-
    Марк не садист. Он администратор катастрофы. Его холодность не от
    отсутствия чувств, а от привычки переводить чувства в параметры. Когда он
    говорит о людях, он говорит о нагрузке, потоке, пропускной способности. Это
    не язык злодея, это язык человека, который давно не рассматривал толпу как
    собрание лиц.
  wound: >-
    Город, который он проектировал, оказался неуправляемым. Его инженерная
    гордость не выдержала реальности.
  lie: >-
    «Люди не выдерживают свободы». Она позволяет ему называть насилие
    лечением.
  defense: >-
    Процедуры, протоколы, вежливость, дистанция.
  triggers:
    - "хаос"
    - "толпа"
    - "потеря темпа"
    - "чужое неподчинение"
  truth_breaker: >-
    Публичное доказательство, что протокол убивает. Не спор, а тело.
  paradox: >-
    Он хочет спасти город, но не спрашивает город, хочет ли он этого спасения.
    Он боится хаоса и создаёт его.

dynamics:
  start: "Архитектор за стеклом. Управляет через приказы. Цена: никто не видит его рук."
  middle: "Личный разговор с Кирой. Показывает подпись. Цена: теряет маску."
  final: "Публично обвинён. Не признаёт вину. Цена: теряет власть, но не убеждения."
  refuses_to_understand: >-
    Что спасение без согласия становится убийством.
  final_choice: >-
    Сохранить протокол для других городов, даже если Кассий уже не спасти.

three_decisions:
  - decision: "Подписывает документы Z-9"
    says: "«Это дозирование»"
    hides: "Понимает, что люди умрут"
    cost: "Город"
  - decision: "Показывает Кире подпись"
    says: "«Вы пришли за подписью»"
    hides: "Хочет вернуть её в работу"
    cost: "Маска"
  - decision: "Отказывается признать вину"
    says: "«Я объясняю конструкцию»"
    hides: "Боится, что конструкция рухнет"
    cost: "Власть"

body_habits:
  - "Поправляет шов перчатки."
  - "Выравнивает бумаги по краю стола."
  - "Ставит стакан параллельно папке."
  - "Ждёт, пока гость сядет, и только потом садится сам."
  - "Не касается дверных ручек, их открывает охрана."
  - "Снимает пылинку с пальто, даже если её нет."
  - "Закрывает ручку колпачком, прежде чем ответить."

power: >-
  Власть для него не привилегия, а обязанность считать. Допуск позволяет
  отделить решение от последствий. Он не применяет насилие руками. Он отдаёт
  приказ и требует, чтобы тот был оформлен.

speech:
  vocabulary:
    - "система"
    - "нагрузка"
    - "дозирование"
    - "стабильность"
    - "процедура"
    - "протокол"
    - "конструкция"
    - "цена"
  syntax: >-
    Полные, ровные фразы. Он не обрывает себя. Любит конструкции «если..., то...»
    и «речь не о..., а о...».
  length: "10-20 слов, иногда длиннее, если объясняет схему. Он не боится говорить."
  tempo_and_pauses: >-
    Медленный, 3,0-3,4 слога в секунду. Пауза перед словом «цена» и после
    вопроса, который задаёт он.
  interrupts: >-
    Не перебивает. Ждёт, пока собеседник договорит, и отвечает на то, что тот
    не сказал.
  silence: "Смотрит на бумаги или на стакан. Молчание у него как часть протокола."
  lies: >-
    Говорит правду, но не всю. Умолчание для него не ложь, а редактура.
  threatens: >-
    Не угрожает. Объясняет последствия так, будто они уже утверждены.
  asks: >-
    Не просит. Предлагает выбор, в котором один вариант уже оплачен.
  favorite_phrases:
    - "город не выдержит правды"
    - "управляемый дождь"
    - "я не отнимаю выбор, я его сужаю"
  never_says:
    - "Я виноват"
    - "Простите"
    - "Я не знал"
  masks:
    - "С советом юридический тон."
    - "С Кирой тон преподавателя."
    - "С охраной короткие распоряжения."
    - "С Веспер почти нежность."
  recognizable: >-
    Он говорит как человек, который уже провёл заседание внутри своей головы.
    Его фразы не ищут согласия, а оформляют решение. Он не кричит и не давит,
    потому что давление уже встроено в конструкцию фразы.
  speech_by_person:
    - person: "Совет"
      manner: "Юридический тон, «мы», пассивные конструкции"
      reveals: "Прячет личную ответственность"
    - person: "Кира"
      manner: "Тон преподавателя, вопросы вместо приказов"
      reveals: "Хочет вернуть ученицу"
    - person: "Охрана"
      manner: "Короткие распоряжения без объяснений"
      reveals: "Привычка к исполнению"
    - person: "Веспер"
      manner: "Тише, почти нежно"
      reveals: "Единственная связь без расчёта"
    - person: "Под давлением"
      manner: "Длиннее, медленнее, вежливее"
      reveals: "Контроль вместо эмоции"

voice:
  gender: "мужской"
  age: 58
  type: "светлый баритон"
  pitch_hz: "110-130"
  range_hz: "95-165"
  tempo_syllables_per_sec: "3,0-3,4"
  volume_db: "55-65"
  timbre: >-
    Мягкий, чистый, с ровной серединой. Не бархат, не металл. Голос хорошо
    поставлен.
  breath: "Ровное, глубокое, почти незаметное. Он не задыхается и не спешит."
  articulation: >-
    Верхний ярус, чистая речь, полные окончания. Лёгкая академическая манера,
    без снобизма.
  accent: "верхний ярус"
  base_emotion: "вежливая уверенность"
  registers:
    anger: "через паузу и точность"
    fear: "через ещё большую вежливость"
    contempt: "через объяснение"
    tenderness: "через внимание к деталям"
  stress_behavior: >-
    Замедляется, становится тише, фразы удлиняются. Он не теряет контроль, он
    его демонстрирует.
  avoid: >-
    Злодейский вкрадчивый шёпот, аристократическое высокомерие, старческое
    дребезжание, тёплый «добрый доктор».
  prompt: >-
    Мужской голос, 58 лет, светлый баритон. Мягкий, чистый, хорошо поставленный
    тембр, ровная середина, без металла и без вкрадчивости. Говорит медленно,
    полными фразами, с паузами перед ценой и после неудобных вопросов. В
    напряжении становится тише и вежливее. Верхний ярус, чистая артикуляция,
    академическая точность без снобизма. Уверенность, контроль, дозированное
    тепло. Не шептать злодейски, не играть «богатого мерзавца», не добавлять
    старческую дрожь.
  negative_prompt: >-
    Не шептать вкрадчиво, не играть «злого гения», не добавлять
    аристократическое высокомерие, не дребезжать, не делать «доброго доктора»,
    не смеяться над жертвой, не повышать голос.

sample_lines:
  - text: "Город не выдержит правды. Ему нужен управляемый дождь"
    direction: "Ровно, как вывод на заседании."
  - text: "Я не отнимаю выбор. Я его сужаю"
    direction: "Пауза перед «сужаю», без нажима."
  - text: "Вы пришли за подписью. Она ваша"
    direction: "Спокойно, с лёгким кивком на бумагу."
  - text: "Город не спасают. Город дозируют"
    direction: "Сухо, без пафоса."
  - text: "Присядьте, Кира. У нас есть время"
    direction: "Тепло, которое сразу становится условием."
  - text: "Я не прошу прощения. Я прошу понять конструкцию"
    direction: "Медленно, с ударением на «конструкцию»."
  - text: "Вы были хорошим оперативником. Вы остались им"
    direction: "Уважение и приговор в одной фразе."

