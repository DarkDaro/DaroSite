    Светлое пальто без логотипов, тёмный костюм, никаких знаков фракции. Он не
    носит форму, потому что форма предполагает ответственность.
  body: >-
    Сухой, подтянутый, не жестикулирует. Сидит ровно, руки на столе.
  face: >-
    Спокойное, вежливое, без резких морщин. Улыбка появляется вовремя и уходит
    вовремя.
  hands: >-
    В перчатках даже в помещении. Он не любит касаться чужих вещей и людей.
  walk: >-
    Медленная, без суеты. Он никогда не опаздывает, поэтому ему не нужно
    спешить.
  strangers_notice: >-
    Он не повышает голос и не смотрит на охрану. Он уверен, что охрана смотрит
    на него.
  under_pressure: >-
    Говорит ещё тише и ещё точнее.

