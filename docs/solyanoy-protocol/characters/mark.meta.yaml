summary: >-
  Марк выглядит как человек, который уже всё решил и ждёт, пока остальные
  догонят. Мягкий голос, чистые ботинки, тонкие перчатки и ни одного лишнего
  движения. Он не наслаждается властью, он ею пользуется как инструментом. Его
  главная ложь не в словах, а в убеждении, что цену можно назначить без
  согласия тех, кто её платит.

