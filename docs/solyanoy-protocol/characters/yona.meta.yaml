signature_note: >-
  Подписи нет. Её имя есть в церковной книге и отсутствует в архиве. Для
  Полотна её не существует, для станции она живая.

psychology:
  core:
    - "Рисует карты, чинит фонари, считает поезда, проверяет вентиляционные решётки."
    - "Ведущая потребность: чтобы её дом перестали искать."
    - "Главный страх: что станцию найдут из-за неё."
    - "Стыд: выжила в Z-9, хотя не должна была."
    - "Считает допустимым молчать, врать взрослым, водить чужих по тайным ходам."
    - "Не прощает обещание вернуться, которое не выполнили."
  wound: >-
    Z-9. Она была ребёнком, когда нижний ярус начал умирать, и осталась жива.
    Взрослые называли это чудом, она называет это вопросом без ответа.
  lie: >-
    «Я не боюсь». Она боится, но страх не должен мешать идти.
  second_lie: >-
    «Я просто провожу». Она не просто провожает. Она выбирает, кого вести и кому
    доверять.
  defense: >-
    Карта. Пока маршрут есть на бумаге, его можно проверить, перепрятать, отдать
    или не отдать.
  triggers:
    - "прожектор в тоннеле"
    - "слово «список»"
    - "взрослый, который говорит «я вернусь»"
  truth_breaker: >-
    Станция, найденная по её карте. Или Кира, которая не вернётся.
  paradox: >-
    Она невидима для сети, но именно её карты делают скрытое видимым.

dynamics:
  start: "«Я не в сети. Я в комнате». Проверяет Киру и ведёт её через шов. Цена: станция становится достижимой."
  middle: "«Он не отдаст карту». Понимает, что Кира не уйдёт. Цена: доверяет взрослому, который может не вернуться."
  final: "«Я проведу их». Выводит детей во время штурма. Цена: рискует быть замеченной и зарегистрированной."
  refuses_to_understand: >-
    Что её иммунитет делает её не только надеждой, но и уликой. Она хочет быть
    просто Йоной, а не доказательством.
  final_choice: >-
    Провести детей через старый тоннель, даже если после этого её увидят.

three_decisions:
  - decision: "Ведёт Киру через шов"
    says: "«Мокрый след»"
    hides: "Боится, что Хан найдёт шов"
    cost: "Станция становится достижимой"
  - decision: "Рисует карты нижнего яруса"
    says: "«Я рисую, чтобы не забыть»"
    hides: "Карты могут найти другие"
    cost: "Знание становится целью"
  - decision: "Выводит детей во время штурма"
    says: "«Я проведу их»"
    hides: "Боится, что не вернётся"
    cost: "Риск быть замеченной"

body_habits:
  - "Касается красной нитки на запястье, когда думает."
  - "Складывает карты в точные квадраты и прячет во внутренний карман."
  - "Сидит на полу, подтянув колени к груди."
  - "Считает поезда под дыхание, беззвучно."
  - "Проверяет вентиляционные решётки ладонью."
  - "Никогда не садится спиной к двери."
  - "Чинит фонарь, даже если он работает."

power: >-
  У Йоны нет должности, оружия и допуска. Её власть в знании маршрутов и в том,
  что Полотно её не видит. Она может провести человека через шов, а может не
  провести. Взрослые не воспринимают её всерьёз, и это даёт ей пространство для
  манёвра. Но власть хрупкая: если её увидят и зарегистрируют, она станет такой
  же, как все, кого ищут.

speech:
  vocabulary:
    - "шов"
    - "красная строка"
    - "поезд"
    - "тоннель"
    - "лампа"
    - "список"
    - "сеть"
    - "тень"
    - "дом"
    - "карта"
    - "пассажир"
    - "без билета"
  syntax: >-
    Короткие фразы, часто с поправкой. «Я не в сети. Я в комнате». «Он видит
    дверь. Не видит линию».
  length: "3-10 слов. В объяснении маршрута длиннее, но без лишнего."
  tempo_and_pauses: >-
    Быстрый, 4,0-4,5 слога в секунду. Пауза перед словом «шов» и перед именем
    Хана.
  interrupts: >-
    Если взрослый говорит неправильно, поправляет сразу. Не из грубости, из
    точности.
  silence: >-
    Смотрит на карту или считает. Молчание у неё не обида, а проверка.
  lies: >-
    Умолчанием и детским лицом. «Я не знаю» говорит ровно, не отводя глаз.
  threatens: >-
    Не угрожает. Предупреждает. «Наверху слышно».
  asks: "Прямо и практично. «Ты вернёшься?»"
  favorite_phrases:
    - "Я не в сети. Я в комнате"
    - "Все так говорят"
    - "Наверху слышно"
    - "Он не отдаст карту"
    - "Домой"
  never_says:
    - "Я маленькая"
    - "Мне всё равно"
    - "Вам виднее"
    - "Я боюсь (только один раз, если доверяет)"
  masks:
    - "С Кирой проводница и проверяющая."
    - "С Ли дочь."
    - "С чужими невидимка."
    - "С детьми старшая."
  recognizable: >-
    Она говорит как человек, который считает шаги и двери даже в разговоре. В её
    речи нет взрослой философии, зато есть точность и поправки. Она часто
    отвечает не на вопрос, а на то, что взрослый пытается скрыть. В стрессе
    ускоряется и переходит на шёпот.
  speech_by_person:
    - person: "Кира"
      manner: "Короткие ответы, поправки, проверка"
      reveals: "Хочет понять, можно ли ей верить"
    - person: "Ли"
      manner: "Мягче и тише, меньше команд"
      reveals: "Он единственный взрослый, которого она не боится"
    - person: "Дети"
      manner: "Короткие распоряжения, без сюсюканья"
      reveals: "Она уже умеет вести"
    - person: "Хан"
      manner: "Молчание или односложный ответ"
      reveals: "Не признаёт его права спрашивать"
    - person: "Чужие"
      manner: "«Просто ребёнок», пустой взгляд"
      reveals: "Это защита, не игра"

voice:
  gender: "женский"
  age: 12
  type: "светлое сопрано"
  pitch_hz: "220-260"
  range_hz: "200-300"
  tempo_syllables_per_sec: "4,0-4,5"
  volume_db: "60-70"
  timbre: >-
    Лёгкий, суховатый, настороженный. Не ангельский, не хрустальный, без
    придыхания.
  breath: >-
    Быстрое, неглубокое. В напряжении задерживает дыхание, потом говорит на
    выдохе.
  articulation: >-
    Нижний ярус, быстрый говор, глотает окончания, но не картавит. Согласные
    острые.
  accent: "нижний ярус"
  base_emotion: "настороженное внимание"
  registers:
    fear: "быстрее и тише"
    anger: "плоский и твёрдый"
    joy: "короткая, удивлённая"
    tenderness: "только с Ли, почти стеснительная"
  stress_behavior: >-
    Ускоряется, поднимается на полтона, потом резко падает до шёпота.
  avoid: >-
    Милая девочка, ангел, ребёнок-символ, взрослая философия из детского рта,
    истерика.
  prompt: >-
    Детский женский голос, 12 лет, светлое сопрано. Лёгкий, суховатый,
    настороженный тембр, без придыхания и без ангельской чистоты. Быстрый ритм,
    нижний ярус, глотает окончания, острые согласные. Говорит короткими фразами,
    часто поправляет взрослых. В страхе ускоряется и переходит на шёпот. Не
    сюсюкать, не играть «милую девочку», не добавлять взрослую мудрость.
  negative_prompt: >-
    Не играть «ангела», не сюсюкать, не делать «ребёнка-символ», не добавлять
    взрослую философию, не всхлипывать, не кричать в панике, не превращать говор
    в карикатуру.

