summary: >-
  Йона выглядит как подросток, которого взрослые привыкли не замечать. Мужская
  куртка не по размеру, школьная сумка с картами, стриженые волосы, острый
  подбородок, красная нитка на левом запястье. Она говорит быстро, коротко и
  настороженно, часто поправляет взрослых и не тратит слова на вежливость. За её
  спокойствием стоит не холодность, а опыт: она слишком часто слышала обещания,
  которые не выполняли.

