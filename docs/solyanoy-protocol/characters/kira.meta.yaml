summary: >-
  Кира выглядит как человек, который давно не спит и не хочет это обсуждать.
  Низкий голос, сухие руки, пустой фильтр, привычка считать выходы. Она не ищет
  правду ради правды. Она ищет подпись, которая объяснит, кем она была.

