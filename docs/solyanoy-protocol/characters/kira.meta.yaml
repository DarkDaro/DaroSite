signature_note: >-
  В разговорах документ называют приказом. По бумаге это передача материалов Z-9
  в архив, подписанная Кирой. Она подписала не приказ на выброс, а документ,
  который закрепил передачу материалов и помог скрыть след. Эта разница важна
  для её вины.

psychology:
  core:
    - "Проверяет замки, считает патроны, перекладывает бумаги так, чтобы их было видно."
    - "Ведущая потребность: быть полезной. Пока она нужна, она имеет право существовать."
    - "Главный страх: что подпись настоящая и что её простят слишком быстро."
    - "Стыд: она выжила после Z-9, а другие нет."
    - "Считает допустимым обман ради доступа, риск для себя, использование чужого допуска."
    - "Не прощает убийство без необходимости и себя за то, что не остановила."
  wound: >-
    Z-9. Три дня, которые она не помнит, и коридор, который помнит лучше, чем
    хочет. Белые стены, серая плитка, запах хлора, чёрное солнце на стене,
    детский кашель.
  lie: >-
    «Я не помню, значит, это была не я». Позже: «Я помню, значит, я должна
    исправить всё одна».
  defense: >-
    Контроль, дистанция, работа. Она сужает задачу до следующего шага, чтобы не
    смотреть на всю картину.
  triggers:
    - "вкус соли"
    - "детский кашель"
    - "слово «подпись»"
    - "начало дождя в 04:20"
  truth_breaker: >-
    Её подпись в архиве. Не слух, не обвинение, а бумага с её росчерком.
  moral_logic: >-
    Кира не считает себя хорошим человеком. Она считает себя человеком, который
    ещё может сделать работу. Её мораль не в невиновности, а в полезности.
    Поэтому она берёт вину на себя раньше, чем её докажут.
  paradox: >-
    Она хочет, чтобы её увидели, и делает всё, чтобы её не увидели. Она спасает
    других, чтобы не просить спасения для себя.

dynamics:
  start: "«Я не помню, значит, меня подставили». Ищет внешнего врага. Цена: теряет время."
  middle: "«Я была там». Признаёт участие. Цена: теряет право на чистые руки."
  final: "«Я подписала. Я исправлю». Действует без оправдания. Цена: остаётся беглой и публично обвинённой."
  refuses_to_understand: >-
    Что её вербовали не силой, а доверием. Марк не ломал её, он дал ей работу
    и смысл.
  final_choice: >-
    Запустить аварийный сброс и остаться на дамбе, даже если это не спасёт её имя.

