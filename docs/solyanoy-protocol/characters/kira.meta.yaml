power: >-
  Власть для Киры означает допуск. Не право, а ключ, который можно
  потерять. Она не верит форме, но говорит её языком, потому что иначе
  не пройдёт. Её сила не в должности, а в способности войти туда, где
  её не ждут, и выйти с документом. Она не стремится командовать.
  Ей достаточно, чтобы её не остановили.

speech:
  vocabulary:
    - "выход"
    - "след"
    - "время"
    - "подпись"
    - "соль"
    - "сектор"
    - "допуск"
    - "патрон"
  syntax: >-
    Короткие утверждения. В стрессе опускает подлежащее: «Не помню», «Успеем»,
    «Закрыто».
  length: "3-8 слов в стрессе, 10-18 в допросе. Длинно говорит только маршрут или объяснение схемы."
  tempo_and_pauses: >-
    Ровный, чуть медленнее среднего. Пауза перед цифрами и после вопроса, на
    который не хочет отвечать. Не заполняет тишину.
  interrupts: >-
    Не перебивает. Ждёт, пока собеседник договорит, и отвечает не на последнюю
    фразу, а на главную.
  silence: >-
    Смотрит на руки, проверяет фильтр, ждёт. Молчание у неё не пустое, а рабочее.
  lies: >-
    Умолчанием и сменой темы на логистику. Прямая ложь получается плохо, потому
    что она считает детали.
  threatens: >-
    Не угрожает. Сообщает факт: «Я знаю, где вы живёте» звучит как адрес, а не
    как угроза.
  asks: >-
    Коротко и без объяснений. «Мне нужен стол. И человек, который умеет молчать».
  favorite_phrases:
    - "сколько у нас времени"
    - "кто подписал"
    - "не сейчас"
    - "я помню соль"
  never_says:
    - "Я не виновата"
    - "Прости меня"
    - "Я хороший человек"
  masks:
    - "С «Редутом» говорит служебным голосом."
    - "С Норой прямо."
    - "С Тэо по делу."
    - "С Йоной мягче, но без сюсюканья."
    - "С Марком предельно вежливо."
  recognizable: >-
    Она не объясняет себя. Она объясняет маршрут. Даже когда говорит о чувствах,
    переводит их в действие: не «мне страшно», а «здесь один выход». Её речь
    похожа на служебную записку, из которой вычеркнули всё лишнее.

voice:
  gender: "женский"
  age: 36
  type: "низкое контральто"
  pitch_hz: "160-190"
  range_hz: "140-220"
  tempo_syllables_per_sec: "3,5-4,0 в норме, 2,5 в стрессе"
  volume_db: "55-65"
  timbre: >-
    Сухой, тёмный, без яркого верха. Грудной резонанс, но не глухой. Не
    «сексуальный хрип».
  breath: >-
    Короткий вдох перед длинной фразой, ровный выдох. Придыхания почти нет. В
    стрессе дыхание становится тише, а не громче.
  articulation: >-
    Чистая, но окончания слов иногда проглатываются. Нижний ярус даёт плоские
    гласные и сжатые окончания. В верхнем ярусе говорит чище, но без снобизма.
  accent: "нижний ярус, плоские гласные, сжатые окончания"
  base_emotion: "усталый контроль"
  registers:
    anger: "тише и медленнее"
    fear: "суше и короче"
    grief: "через паузу и сжатие челюсти"
    tenderness: "почти на грани слышимости"
    pain: "через один короткий вдох"
  stress_behavior: >-
    Темп падает с 3,5-4,0 до 2,5 слога в секунду. Паузы становятся длиннее.
    Фразы короче.
  avoid: >-
    Надрыв, шёпот в микрофон, придыхание, «женщина-экшен» с рычанием, ровный
    робот без дыхания.
  prompt: >-
    Женский голос, 36 лет, низкое контральто. Сухой, тёмный тембр, грудной
    резонанс, почти без придыхания. Говорит ровно, экономно, с паузами перед
    цифрами и после неудобных вопросов. В стрессе становится тише и медленнее,
    не повышает голос. Чистая артикуляция с лёгким нижним акцентом: плоские
    гласные, проглоченные окончания. Усталость, контроль, отсутствие мелодрамы.
    Не шептать, не давить эмоцию, не делать «нуарную роковую женщину».
  negative_prompt: >-
    Не придыхать, не шептать в микрофон, не рычать, не играть
    «женщину-экшена», не добавлять сексуальный хрип, не делать ровного робота
    без дыхания, не всхлипывать, не повышать голос в гневе.

