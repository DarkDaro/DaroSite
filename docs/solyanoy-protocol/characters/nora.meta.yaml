summary: >-
  Нора выглядит как человек, который всегда знает цену, но не всегда называет
  её вслух. Она быстрая, цепкая, с шершавым голосом и готовой усмешкой. За
  торгом у неё стоит не жадность, а страх, что брат останется строкой в списке
  пропавших. Она помогает только тем, кто возвращается.

