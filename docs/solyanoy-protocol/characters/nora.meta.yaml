signature_note: >-
  Подпись Норы не фигурирует в деле Z-9. Её рычаг не подпись, а долговая
  книга и накладная 03-А. Именно поэтому она требует доказательство, а не
  обещание.

psychology:
  core:
    - "Записывает в долговую книгу всё, что может пригодиться."
    - "Ведущая потребность: чтобы кто-то вернулся. Не просто пообещал, а вернулся."
    - "Главный страх: брат мёртв, а она потратила годы на сделки с людьми, которые его убили."
    - "Стыд: она продавала фильтры и допуски в кварталах, где потом умирали дети."
    - "Считает допустимым обман, контрабанду, взятку, риск для чужого."
    - "Не прощает невыполненное обещание и фальшивое «спасибо»."
  accounting: >-
    Нора живёт по бухгалтерии. У всего есть цена: фильтр, допуск, информация,
    молчание, жизнь. Это не цинизм, а способ не сойти с ума. Если у смерти есть
    цена, её можно хотя бы записать.
  wound: >-
    Брат ушёл в Z-9 и не вернулся. Официально пропал без вести.
  lie: >-
    «Мне нужны только деньги». На самом деле ей нужно доказательство, что брат
    был человеком, а не строкой в списке.
  defense: >-
    Торг, ирония, движение. Она не остаётся в тишине, где придётся думать.
  triggers:
    - "слово «Z-9»"
    - "детский кашель"
    - "чужая благодарность"
  truth_breaker: >-
    Тело брата, бумага с его именем или запись, где он жив.
  paradox: >-
    Она продаёт доступ, но хочет верности. Она берёт плату со всех, кроме тех,
    кто действительно нужен.

dynamics:
  start: "«Ты мне должна». Помогает за долг. Цена: держит дистанцию."
  middle: "«Я иду с тобой». Рискует мастерской и собой. Цена: теряет точку опоры."
  final: "«Принеси мне доказательство». Покупает шанс, а не уверенность. Цена: может получить тело вместо человека."
  refuses_to_understand: >-
    Что брат мог быть частью системы, а не только её жертвой.
  final_choice: >-
    Идти до конца, даже если антитело опоздает.

three_decisions:
  - decision: "Пускает Киру в мастерскую"
    says: "«Ты мне должна»"
    hides: "Боится, что Кира не вернётся"
    cost: "Рискует убежищем"
  - decision: "Идёт в порт за накладной"
    says: "«Мне нужна бумага»"
    hides: "Хочет увидеть имя брата"
    cost: "Оставляет мастерскую без присмотра"
  - decision: "Не сдаёт Киру Хану"
    says: "«Я не работаю с Редутом»"
    hides: "Верит, что Кира вернёт брата"
    cost: "Теряет защиту"

body_habits:
  - "Стучит ногтем по кружке, когда считает."
  - "Вытирает руки о комбинезон перед разговором о брате."
  - "Не садится, пока гость не сядет."
  - "Держит ключ или нож в руке, когда нервничает."
  - "Смеётся на выдохе, коротко."
  - "Проверяет замок дважды, даже если только что закрыла."

power: >-
  Власть для Норы означает доступ к чужому страху. Она не любит форму, но
  умеет ею пользоваться. В мастерской её власть в том, что она знает, где
  лежит товар. В порту в том, что она знает, кто кому должен. Она не стремится
  командовать. Ей достаточно, чтобы без неё не проходили.

speech:
  vocabulary:
    - "товар"
    - "цена"
    - "плата"
    - "долг"
    - "фильтр"
    - "допуск"
    - "партия"
    - "караван"
    - "мокрый след"
  syntax: >-
    Быстрые короткие фразы, часто с вопросом в конце. Любит уточнения:
    «Сколько?», «Кто платит?», «Чем докажешь?».
  length: "4-12 слов. В торге может говорить длинно и с удовольствием."
  tempo_and_pauses: >-
    Быстрый, 4,5-5,0 слога в секунду. Пауза перед ценой, чтобы собеседник
    успел испугаться.
  interrupts: >-
    Легко и без извинений. Перебивает не из злости, а чтобы не терять темп.
  silence: "Считает. Молчание у неё короткое, как пауза перед ударом."
  lies: >-
    Гладко и с деталями. Врёт так, будто объясняет товар.
  threatens: >-
    Понижает голос и говорит о цене. «Ты не дойдёшь до порта» звучит как
    накладная.
  asks: "Не просит. Предлагает сделку."
  favorite_phrases:
    - "долг"
    - "цена"
    - "не люблю работать с людьми из Редута"
    - "я записываю всё, что может пригодиться"
  never_says:
    - "Мне просто нужна помощь"
    - "Я тебе доверяю"
    - "Спасибо"
  masks:
    - "С Кирой торг и ирония."
    - "С Ханом осторожная наглость."
    - "С Йоной короткая нежность."
    - "С братом в памяти длинные фразы."
  recognizable: >-
    Она переводит чувства в сделку. Даже когда ей больно, она спрашивает, кто
    заплатит. Это не жадность, а способ удержаться на ногах. Её речь быстрее,
    чем у Киры, и в ней больше воздуха.
  speech_by_person:
    - person: "Кира"
      manner: "Торг, быстрые вопросы, короткие шутки"
      reveals: "Проверяет, не сломается ли Кира"
    - person: "Хан"
      manner: "Осторожная наглость, короткие ответы"
      reveals: "Боится, но не показывает"
    - person: "Йона"
      manner: "Мягче, меньше иронии, практические указания"
      reveals: "Заботится без слов"
    - person: "Брат в памяти"
      manner: "Длинные фразы, без торга"
      reveals: "Горе, которое она не называет"
    - person: "Угроза"
      manner: "Падение громкости, цена вместо эмоции"
      reveals: "Готовность действовать"

voice:
  gender: "женский"
  age: 31
  type: "меццо"
  pitch_hz: "190-220"
  range_hz: "170-260"
  tempo_syllables_per_sec: "4,5-5,0, в торге до 5,2"
  volume_db: "60-70"
  timbre: >-
    Шершавый, чуть прокуренный, с тёплой серединой. Не хрип, а след порта и
    дождя.
  breath: >-
    Свободное, часто с коротким смешком на выдохе. Не придыхание.
  articulation: >-
    Портовый говор. Съедает окончания, растягивает гласные, иногда ставит
    ударение не там. Не делает из этого комедию.
  accent: "портовый"
  base_emotion: "ирония и готовность торговаться"
  registers:
    anger: "быстрый и острый"
    fear: "через шутку"
    grief: "через паузу и смену темы"
    tenderness: "через практическое действие, а не через голос"
  stress_behavior: "Ускоряется, потом резко падает в тишину."
  avoid: >-
    «Бойкая торговка», «роковая контрабандистка», «сердечная мамочка»,
    визгливая паника.
  prompt: >-
    Женский голос, 31 год, меццо с шершавой тёплой серединой. Быстрый портовый
    ритм, лёгкий говор, съеденные окончания. Ирония в мелодике, смешок на
    выдохе, но без кокетства. В торге говорит быстро и точно, в угрозе резко
    понижает голос. Усталость и цепкость, много движения, мало
    сентиментальности. Не визжать, не играть «бойкую контрабандистку», не
    добавлять сексуальный хрип.
  negative_prompt: >-
    Не визжать, не кокетничать, не делать «роковую контрабандистку», не
    добавлять хрип ради хрипа, не играть «уличную маму», не всхлипывать, не
    превращать говор в комедию.

sample_lines:
  - text: "Ты рано. Я ещё не открылась"
    direction: "Сухо, с ленивой усмешкой, без приглашения."
  - text: "У тебя кровь на рукаве"
    direction: "Не вопрос. Она уже оценила цену."
  - text: "Потому что живого курьера с этой накладной не оставляют"
    direction: "Быстро, тихо, без пафоса."
  - text: "Мне не нужны твои деньги"
    direction: "Пауза. Потом цена: брат."
  - text: "Свобода стоит как хороший фильтр. И так же быстро забивается"
    direction: "Ирония, но не шутка."
  - text: "Ты вышла отсюда с сухим фильтром, чужой курткой и долгом, который дороже пробирки"
    direction: "Медленнее, чтобы каждая вещь была услышана."
  - text: "Он не врёт про ярус. Бумаги уже подписаны"
    direction: "Устало, без надежды."

