appearance:
  three_details:
    - "резиновые перчатки до локтя"
    - "туго собранные волосы"
    - "следы машинного масла на рубашке"
  clothes: >-
    Мужская рубашка, рабочий комбинезон, тяжёлые ботинки. На поясе инструмент,
    а не украшение.
  body: >-
    Среднего роста, крепкая, с сильными предплечьями. Двигается быстро и
    экономно, как человек, который часто таскает груз.
  face: >-
    Широкое, загорелое, с постоянной усмешкой в уголках губ. Синяк после
    допроса не делает её жалкой.
  hands: "Всегда заняты. Она чинит, перебирает, считает, открывает."
  walk: >-
    Быстрая, чуть вразвалку, как у портового грузчика. Не боится занимать
    проход.
  strangers_notice: >-
    Она смотрит на руки и на товар, а не на лицо.
  under_pressure: >-
    Начинает торговаться. Даже когда торговаться не о чём.

