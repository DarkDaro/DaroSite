body_habits:
  - "Растирает соль с ладоней."
  - "Держит лицо закрытым, даже когда говорит."
  - "Пьёт воду медленно, маленькими глотками."
  - "Ходит по краю настила, проверяя опору."
  - "Останавливается, чтобы послушать воду."
  - "Никогда не садится спиной к выходу."
  - "Оставляет после себя след, который быстро заносит солью."

power: >-
  У Соляного человека нет должности, оружия и фракции. Его власть
  биологическая: только его кровь даёт антитело. Он может отдать её или
  отказать. Он может исчезнуть, и тогда последний шанс города исчезнет вместе с
  ним. Но эта власть не свобода, а клетка. Чем нужнее его кровь, тем меньше в нём
  видят человека. Он пользуется властью как границей: не отдаёт больше, чем
  хочет, и не позволяет называть это жертвой.

speech:
  vocabulary:
    - "соль"
    - "вода"
    - "кровь"
    - "дождь"
    - "дамба"
    - "берег"
    - "след"
    - "память"
    - "образец"
    - "игла"
    - "цена"
    - "отсрочка"
  syntax: >-
    Короткие фразы, часто с паузой. «Это не спасение. Это отсрочка». «Я не
    оружие».
  length: "3-10 слов. В объяснении прошлого длиннее, но без подробностей."
  tempo_and_pauses: >-
    Медленный, 2,6-3,0 слога в секунду. Пауза перед словом «кровь» и после
    вопроса о цене.
  interrupts: >-
    Не перебивает. Ждёт, пока собеседник закончит, и отвечает на главное.
  silence: >-
    Слушает воду, ветер, соль. Молчание у него как ещё один вопрос.
  lies: >-
    Умолчанием и легендой. «Меня нет» может означать «не ищите меня».
  threatens: >-
    Не угрожает. Называет условие. «Если вы возьмёте без спроса, я исчезну».
  asks: "Не просит. Предлагает обмен или отказывает."
  favorite_phrases:
    - "Соль помнит того, кто её пролил"
    - "Это не спасение. Это отсрочка"
    - "Я не оружие"
    - "Не трогайте меня без спроса"
  never_says:
    - "Я святой"
    - "Я легенда"
    - "Мне всё равно"
    - "Берите"
  masks:
    - "С Кирой проверка."
    - "С Ли узнавание."
    - "С Марком молчание."
    - "С Норой легенда."
    - "С собой соль."
  recognizable: >-
    Он говорит как человек, который давно научился экономить слова и дыхание.
    В его речи всегда есть пауза, вопрос о цене или граница. Он не повышает
    голос, потому что тишина уже работает как отказ.
  speech_by_person:
    - person: "Кира"
      manner: "Вопросы о цене, короткие ответы"
      reveals: "Хочет понять, видит ли она человека"
    - person: "Ли"
      manner: "Тише, меньше пауз"
      reveals: "Они знают друг друга или знают друг о друге"
    - person: "Нора"
      manner: "Почти не говорит, слушает"
      reveals: "Она ищет легенду, а не человека"
    - person: "Марк"
      manner: "Молчание и отказ"
      reveals: "Не признаёт его права на кровь"
    - person: "Вода"
      manner: "Ничего не говорит"
      reveals: "Единственный собеседник без расчёта"

voice:
  gender: "мужской"
  age: "неизвестен, на слух после пятидесяти"
  type: "сухой, сорванный тенор"
  pitch_hz: "125-145"
  range_hz: "110-165"
  tempo_syllables_per_sec: "2,6-3,0"
  volume_db: "50-60"
  timbre: >-
    Шершавый, с соляной хрипотцой, не бас и не шёпот. Голос человека, который
    долго дышал пылью.
  breath: >-
    Медленное, слышное. После длинной фразы делает паузу, будто проверяет,
    хватит ли воздуха.
  articulation: >-
    Береговой говор, без яруса. Согласные нечёткие, окончания смазаны солью, но
    смысл точный.
  accent: "береговой, без яруса"
  base_emotion: "усталое внимание"
  registers:
    anger: "тише и твёрже"
    fear: "практичнее"
    grief: "через молчание"
    tenderness: "через предложенную воду"
  stress_behavior: >-
    Останавливается, дышит, касается соли, потом говорит ещё тише.
  avoid: >-
    Мистический шёпот, святой, монстр, призрак, добрый дедушка, экзотический
    акцент.
  prompt: >-
    Мужской голос, возраст неопределённый, ближе к пятидесяти. Сухой, сорванный
    тенор, 125-145 Гц, с соляной хрипотцой и медленным дыханием. Говорит тихо,
    короткими фразами, с длинными паузами. Береговой говор, без яруса, окончания
    смазаны, но смысл точный. В напряжении становится ещё тише. Усталость,
    граница, память. Не играть «мистического старца», не шептать загадочно, не
    добавлять святость.
  negative_prompt: >-
    Не делать призрака, не добавлять зловещий шёпот, не играть святого, не
    изображать монстра, не сюсюкать, не добавлять экзотический акцент, не
    превращать паузы в многозначительность.

