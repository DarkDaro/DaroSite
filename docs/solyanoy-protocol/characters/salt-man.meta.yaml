summary: >-
  Соляной человек выглядит как фигура в плаще, которую трудно рассмотреть. Лицо
  не читается: его закрывает капюшон, шарф или тень. Он собирает соль на полях и
  у дамбы, ходит медленно, говорит тихо и никогда не подходит первым. В городе его
  считают легендой, в «Тихом Свете» утечкой, а Кира видит в нём последний шанс. Он
  не хочет быть ни тем, ни другим. Он хочет, чтобы его спросили, чего он хочет,
  прежде чем брать кровь.

