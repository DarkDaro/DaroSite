  существует.

psychology:
  core:
    - "Собирает соль, сидит у воды, проверяет старые выходы с дамбы, уходит до рассвета."
    - "Ведущая потребность: остаться человеком, а не стать оружием или образцом."
    - "Главный страх: снова оказаться на столе, под иглой, в чужом отчёте."
    - "Стыд: он выжил в Z-9, а другие нет."
    - "Считает допустимым скрываться, лгать о себе, торговаться, отдавать кровь только по своей воле."
    - "Не прощает прикосновение без спроса и слово «образец»."
  wound: >-
    Z-9. Его использовали в первом испытании, а потом вычеркнули из отчётов. Он
    видел, как лечение превращается в приказ.
  lie: >-
    «Я просто собираю соль». Это защита. Он не просто собирает соль, он хранит
    знание о том, что с ним сделали.
  second_lie: >-
    «Меня нет». Пока о нём говорят как о легенде, его не ищут как человека. Но
    легенда тоже привлекает охотников.
  defense: >-
    Дистанция. Плащ, закрытое лицо, молчание, вода между ним и собеседником.
  triggers:
    - "игла"
    - "запаянный пакет"
    - "слово «образец»"
    - "звук дождя"
    - "детский кашель"
  truth_breaker: >-
    Вопрос «чего ты хочешь?», заданный без расчёта.
  paradox: >-
    Его кровь может спасти город, но каждое использование снова превращает его в
    оружие.

dynamics:
  start: "Легенда. О нём говорят, но не находят. Цена: его считают мифом."
  middle: "«Что вы готовы отдать?». Встречает Киру на дамбе и проверяет её. Цена: признаёт, что он реален."
  final: "«Это не спасение. Это отсрочка». Отдаёт кровь и уходит по воде. Цена: слабость, возможная смерть."
  refuses_to_understand: >-
    Что его согласие не отменяет того, что его кровь снова станет чужой
    собственностью.
  final_choice: >-
    Отдать кровь добровольно и уйти, не обещая, что спасение будет милосердным.
    Судьба открыта.

