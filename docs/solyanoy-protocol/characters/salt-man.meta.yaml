  clothes: >-
    Тёмный плащ, несколько слоёв старой одежды, шарф, капюшон, крепкие ботинки.
    Всё выцвело от соли.
  body: >-
    Худое, усталое, но крепкое. Двигается медленно, экономит силы.
  face: >-
    Не читается. В записи с дамбы черты смазаны, вблизи их закрывает тень.
  hands: >-
    Сухие, в мелких трещинах, с белыми следами соли. Он часто растирает их.
  eyes: >-
    Внимательные, усталые. Он смотрит на человека, потом на воду.
  strangers_notice: >-
    Он не пахнет страхом. Он пахнет солью и мокрой тканью.
  under_pressure: >-
    Замирает, опускает руки, ждёт, пока другой сделает первый шаг.
  working_note: >-
    Капюшон, шарф, слои одежды и трещины на руках не описаны в опубликованных
    главах. Это опора для актёра и художника, а не канон.

