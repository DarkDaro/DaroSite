body_habits:
  - "Наклоняет голову к приёмнику, будто слышит не звук, а направление."
  - "Касается повреждённой руки, когда думает о Z-9."
  - "Протирает стол чистой тряпкой перед тем, как налить чай."
  - "Накрывает приходскую книгу ладонью, когда разговор подходит к опасному имени."
  - "Поправляет вязаную шапку, даже если она сидит ровно."
  - "Делает паузу перед именем, чтобы вспомнить не только лицо, но и голос."
  - "Никогда не повышает голос. В гневе становится тише."

power: >-
  Ли не командует «Тихими». У него нет ни оружия, ни должности, ни права
  приказывать. Его власть в том, что он остался, когда другие ушли, и помнит
  имена, которые система вычеркнула. Люди слушают его не из страха, а потому что
  он держит свет. Но эта власть обязывает: он решает, кому дать карту, кого
  отправить в тоннель, когда молчать и когда говорить. Он пользуется ею
  осторожно и всё равно ошибается.

speech:
  vocabulary:
    - "имена"
    - "список"
    - "сигнал"
    - "тишина"
    - "канал"
    - "частота"
    - "помехи"
    - "свет"
    - "чай"
    - "станция"
    - "поезд"
    - "темнота"
    - "масштаб"
    - "цена"
  syntax: >-
    Короткие полные фразы. Часто говорит притчами, но без пафоса. «Пожар
    удобен». «Тишина тоже сигнал».
  length: "4-12 слов. В объяснении Z-9 может говорить длиннее, но всё равно без лишнего."
  tempo_and_pauses: >-
    Медленный, 2,8-3,2 слога в секунду. Пауза перед именем и после вопроса,
    который он задаёт не для ответа.
  interrupts: >-
    Почти никогда. Даёт договорить и отвечает на то, что человек не сказал.
  silence: >-
    Слушает радио или смотрит на книгу. Молчание у него не пустое, а наполненное
    чужими голосами.
  lies: >-
    Умолчанием и притчей. «Говорят, существует» может означать «я знаю больше,
    но не скажу».
  threatens: >-
    Не угрожает. Называет последствие. «Станция не выдержит штурма».
  asks: "Не просит. Предлагает чай, место или выбор."
  favorite_phrases:
    - "Тишина тоже сигнал"
    - "Чай на плите"
    - "Это не ваше дело. Пока"
    - "Вы ещё не понимаете"
  never_says:
    - "Я святой"
    - "Я не знал"
    - "Мне всё равно"
    - "Я приказываю"
  masks:
    - "С Кирой учитель и проверяющий."
    - "С Йоной тепло и тревога."
    - "С «Тихими» ровная опора."
    - "С радио голос без маски."
  recognizable: >-
    Он говорит как человек, который сначала слушает помехи, а потом собеседника.
    В его речи всегда есть пауза перед именем и после вопроса. Он не повышает
    голос, потому что тишина уже работает как давление. В эфире его фразы
    становятся чище и короче, но пафос не появляется.
  speech_by_person:
    - person: "Кира"
      manner: "Вопросы, притчи, проверка"
      reveals: "Хочет понять, выдержит ли она правду"
    - person: "Йона"
      manner: "Короче и мягче, меньше притч"
      reveals: "Она ему как дочь"
    - person: "«Тихие»"
      manner: "Спокойные распоряжения, без нажима"
      reveals: "Он отвечает за них, хотя не командует"
    - person: "Радио"
      manner: "Чистые фразы, ровный ритм"
      reveals: "Здесь он не прячется"
    - person: "«Редут»"
      manner: "Молчание и отказ"
      reveals: "Не признаёт их права спрашивать"

voice:
  gender: "мужской"
  age: 64
  type: "низкий баритон"
  pitch_hz: "100-125"
  range_hz: "90-150"
  tempo_syllables_per_sec: "2,8-3,2"
  volume_db: "55-65"
  timbre: >-
    Сухой, тихий, с лёгкой хрипотцой и дыханием старого радио. Не шёпот, не
    проповедь.
  breath: >-
    Медленное, слышное в паузах. После подъёма по лестнице сбивается, и он это не
    скрывает.
  articulation: >-
    Чистая, полные окончания, старая верхняя школа связи. Без церковного пения.
  accent: "верхний ярус, старая школа связи"
  base_emotion: "тихое внимание"
  registers:
    anger: "тише и твёрже"
    fear: "практичнее"
    grief: "через имя и паузу"
    tenderness: "через чай и одеяло"
  stress_behavior: >-
    Замедляется, опускается ниже, фразы становятся короче. Он держится за
    приёмник.
  avoid: >-
    Мудрый старец, святой старец, добрый дедушка, театральный шёпот, церковная
    проповедь.
  prompt: >-
    Мужской голос, 64 года, низкий баритон. Сухой, тихий тембр с лёгкой
    хрипотцой и дыханием старого радио. Говорит медленно, короткими полными
    фразами, с паузами перед именами. Чистая старая артикуляция верхнего яруса,
    без церковного пения и без пафоса. В напряжении становится тише и твёрже.
    Усталость, внимание, память. Не играть «мудрого старца», не шептать
    театрально, не добавлять святость.
  negative_prompt: >-
    Не играть «доброго дедушку», не добавлять церковную проповедь, не шептать
    загадочно, не делать «мудрого волшебника», не дребезжать, не всхлипывать, не
    повышать голос в гневе, не превращать паузы в многозначительность.

