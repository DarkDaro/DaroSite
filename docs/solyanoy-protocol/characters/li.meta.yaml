signature_note: >-
  Подписи нет. Его след в приходской книге, в служебном журнале узла связи и в
  эфирной записи. Он не подписывал приказы, но слышал их и молчал.

psychology:
  core:
    - "Слушает помехи, чинит антенну, записывает имена, греет воду."
    - "Ведущая потребность: сохранить имена и свет на станции."
    - "Главный страх: станцию найдут, а имена исчезнут из списков."
    - "Стыд: был на узле связи в Z-9, слышал, как замолчали каналы, и не остановил это."
    - "Считает допустимым укрывать людей, не отдавать карту, говорить не всю правду, выходить в эфир под угрозой штурма."
    - "Не прощает стирание имён, равнодушие к мёртвым и жертву, которую называют необходимостью."
  wound: >-
    Ночь Z-9. Он слышал, как один за другим замолкают каналы, и понял, что там
    умирают люди. Он не смог или не успел вмешаться.
  lie: >-
    «Я не командир. Я просто держу свет». На самом деле он принимает решения за
    всю станцию.
  second_lie: >-
    «Я не знаю, где Соляной человек». Он знает больше, чем говорит, но
    проверяет, что Кира сделает с правдой.
  defense: >-
    Ритуал. Чай, радио, книга, чистая тряпка на столе. Ритуал позволяет не
    смотреть на весь ужас сразу.
  triggers:
    - "тишина в эфире"
    - "детские имена"
    - "слово «список»"
    - "упоминание дамбы"
  truth_breaker: >-
    Сорок седьмое имя, произнесённое вслух. Или голос, который он не ожидал
    услышать.
  paradox: >-
    Он сохраняет станцию, скрывая её, и губит её, когда выходит в эфир.

dynamics:
  start: "«Чай на плите». Проверяет Киру, не отдаёт карту. Цена: Кира уходит без полной правды."
  middle: "«Станция не выдержит штурма». После приступа зависит от других. Цена: теряет возможность действовать сам."
  final: "«Говорит Станция Ноль». Выходит в эфир. Цена: станция становится целью."
  refuses_to_understand: >-
    Что его молчание тоже было выбором. Он признаёт, что слышал каналы, но не
    признаёт, что мог сказать раньше.
  final_choice: >-
    Выйти в эфир и назвать имена, зная, что после этого придут.

three_decisions:
