summary: >-
  Отец Ли выглядит как старик, который давно перестал спешить и научился
  слушать то, что остальные считают шумом. Тёмное пальто, вязаная шапка,
  старый радиоприёмник на коленях, на одной руке не хватает двух пальцев. Он
  говорит тихо, короткими фразами, часто делает паузы и никогда не повышает
  голос. За его спокойствием стоит не святость, а память: сорок семь имён,
  сорок шесть в списке, один человек, которого он не называет.

