appearance:
  three_details:
    - "короткая стрижка"
    - "фильтр в серебряной рамке"
    - "тонкий шрам на левом запястье"
  clothes: >-
    Серое пальто, тёмный костюм, перчатки. Никаких колец. Матовый металлический
    браслет на левом запястье.
  body: >-
    Собранное, не суетливое. Двигается так, будто каждое движение уже
    согласовано с расписанием.
  face: >-
    Спокойное, внимательное, без резкой мимики. Когда она устаёт, лицо на
    секунду теряет собранность, потом возвращается.
  hands: >-
    Ухоженные, с короткими ногтями. Она снимает перчатки перед папкой, как
    хирург перед столом.
  eyes: >-
    В них горит тонкая зелёная линия второго контура. Это не украшение, а
    служебная метка, которую она не прячет.
  strangers_notice: >-
    Она не спешит и не повышает голос. Кажется, что она уже знает, чем
    закончится разговор.
  under_pressure: >-
    Становится ещё вежливее, ещё точнее, ещё тише.

