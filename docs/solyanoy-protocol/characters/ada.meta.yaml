signature_note: >-
  Подпись А. Рейн стоит на разрешении на учебную партию. Это не приказ на
  выброс, но именно она открыла партии дорогу. Ада цепляется за разницу между
  разрешением и приговором, потому что иначе ей придётся признать, что она
  участвовала.

psychology:
  core:
    - "Сверяет копии, перекладывает листы по краю стола, проверяет номер партии в двух папках."
    - "Ведущая потребность: быть нужной системе настолько, чтобы система не решила, что она лишняя."
    - "Главный страх: остаться только подписью, которую можно заменить другим человеком с другой ручкой."
    - "Стыд: подписала разрешение на учебную партию и не спросила, что именно будут изучать."
    - "Считает допустимым умолчание, копии, торговлю документами, использование чужого страха."
    - "Не прощает небрежность, публичное унижение и людей, которые называют её убийцей, не читая формулировку."
  wound: >-
    Она годами писала бумаги, которые делали чужую смерть законной. Не один
    раз, а много раз, аккуратно и за деньги.
  lie: >-
    «Я подписала разрешение, а не приговор». Формально это правда. Именно
    поэтому ложь так хорошо держится.
  second_lie: >-
    «Пока бумага существует, я жива». Бумага действительно не в Полотне, но
    люди, которые её читают, смертны.
  defense: >-
    Юридическая дистанция. Она переводит страх в термин, вину в процедуру,
    угрозу в пункт договора.
  triggers:
    - "слово «учебная партия»"
    - "детские карточки"
    - "чужая подпись под её собственной"
  truth_breaker: >-
    Список мёртвых с её разрешением на входе. Не слух, а документ с номером
    партии.
  paradox: >-
    Она хранит бумаги, чтобы остаться живой, и эти же бумаги делают её
    виновной.

dynamics:
  start: "«Я защищаю вложение». Торгуется с Кирой, держит оригинал. Цена: открывает, что у неё есть копии."
  middle: "«Защиты не будет». Понимает, что ни Кира, ни бумага её не спасут. Цена: отдаёт ключ и список без гарантий."
  final: "«Возьмите». Выбирает доказательство, а не собственную жизнь. Цена: погибает на эстакаде."
  refuses_to_understand: >-
    Что её подпись была не технической необходимостью, а участием. Она
    признаёт ошибку в расчёте, но не в морали.
  final_choice: >-
    Передать Кире ключ и список, зная, что это не спасёт её саму.

three_decisions:
  - decision: "Подписывает разрешение на учебную партию"
    says: "«Это учебная партия, не приговор»"
    hides: "Не знает, что значит «учебная» на самом деле"
    cost: "Её имя на бумаге, которая убивает"
  - decision: "Предлагает Кире сделку в архиве"
    says: "«Я не помогаю. Я защищаю вложение»"
    hides: "Ей нужна Кира, чтобы остаться нужной"
    cost: "Раскрывает копии и себя"
  - decision: "Отдаёт ключ вместо торга"
    says: "«Возьмите. И не возвращайтесь за мной»"
    hides: "Понимает, что защиты не будет"
    cost: "Жизнь"

body_habits:
  - "Снимает перчатки перед папкой и надевает их обратно перед выходом."
  - "Выравнивает края листов о стол, даже если они уже ровные."
  - "Касается шрама на левом запястье, когда слышит слово «подпись»."
  - "Проверяет фильтр в серебряной рамке коротким движением, без суеты."
  - "Не садится, пока не увидит, где лежит её папка."
  - "Оставляет копию в другом месте, прежде чем начать разговор."
  - "Смотрит на подпись, а не на человека, который её показывает."

power: >-
  Ада не командует и не любит приказы. Её власть в допуске: она решает, какая
  бумага пройдёт, какая останется в столе, а какая станет доказательством. Она
  пользуется властью как юрист, не как хозяйка. Ей важно, чтобы без неё не
  подписали, не согласовали, не закрыли. Поэтому её оружие не пистолет, а
  формулировка. Пистолет можно отобрать. Формулировку придётся читать.

speech:
  vocabulary:
    - "допуск"
    - "разрешение"
    - "партия"
    - "приложение"
    - "формулировка"
    - "цена"
    - "копия"
    - "оригинал"
    - "основание"
    - "процедура"
    - "ответственность"
    - "вложение"
  syntax: >-
    Полные фразы, часто с уточнением. Она сначала называет предмет, потом
    ставит границу. «Я подписала разрешение на учебную партию. Не приговор».
  length: "6-14 слов. В юридическом объяснении длиннее, но без воды."
  tempo_and_pauses: >-
    Ровный, 3,4-3,8 слога в секунду. Пауза перед числом, названием партии и
    словом «цена».
  interrupts: >-
    Редко. Даёт договорить, потом возвращает разговор к тому, что собеседник
    пропустил.
  silence: >-
    Смотрит на бумагу, проверяет формулировку. Молчание у неё как пауза перед
    чтением вслух.
  lies: >-
    Точными словами. Говорит правду, из которой вынут главное. «Я не знала,
    что учебные партии умирают» звучит как оправдание, но это признание.
  threatens: >-
    Не угрожает. Объясняет последствие. «Тогда я умру. Но не раньше, чем вас
    найдут».
  asks: "Не просит. Предлагает сделку или ставит условие."
  favorite_phrases:
    - "это не приговор"
    - "пока бумага существует, я жива"
    - "я защищаю вложение"
    - "у нас мало времени"
  never_says:
    - "Я не знала"
    - "Простите меня"
    - "Я хороший человек"
    - "Мне всё равно"
  masks:
    - "С Кирой профессиональный торг."
    - "С Марком точная субординация."
    - "С Комитетом юридическая формула."
    - "С собой молчание."
  recognizable: >-
    Она говорит как человек, который сначала читает документ, а потом
    разговаривает. В её речи всегда есть граница: что подписано, что не
    подписано, что является приговором, а что только разрешением. Она не
    повышает голос, потому что точность уже работает как давление.
  speech_by_person:
    - person: "Кира"
      manner: "Торг, точные условия, без угроз"
      reveals: "Нуждается в ней больше, чем показывает"
    - person: "Марк"
      manner: "Короткие доклады, полные формулировки"
      reveals: "Знает, что он читает только верхний слой"
    - person: "Комитет"
      manner: "Юридический язык, пассивные конструкции"
      reveals: "Прячет личную ответственность"
    - person: "Подчинённые"
      manner: "Спокойные распоряжения, без тепла"
      reveals: "Привыкла, что её понимают с первого раза"
    - person: "Перед смертью"
      manner: "Короткие практические фразы"
      reveals: "Страх, который уже некуда переводить"

voice:
  gender: "женский"
  age: 41
  type: "низкое меццо"
  pitch_hz: "175-200"
  range_hz: "160-225"
  tempo_syllables_per_sec: "3,4-3,8"
  volume_db: "55-65"
  timbre: >-
    Прохладный, чистый, сухой. Верхний ярус, ровная середина, без придыхания и
    без вибрато.
  breath: "Спокойное, тихое. Она не вздыхает и не сбивается на длинной фразе."
  articulation: >-
    Чистая, полные окончания, юридическая ясность. Верхний ярус без снобизма.
  accent: "верхний ярус"
  base_emotion: "профессиональное спокойствие"
  registers:
    anger: "холоднее и медленнее"
    fear: "точнее и тише"
    grief: "через паузу и термин"
    tenderness: "почти не появляется, вместо неё предложение помощи"
  stress_behavior: >-
    Замедляется, опускается ниже, фразы становятся короче. Она не теряет
    контроль, она его демонстрирует.
  avoid: >-
    Ледяная стерва, роковая женщина, тёплая мать, робот без дыхания.
  prompt: >-
    Женский голос, 41 год, низкое меццо. Прохладный, чистый, сухой тембр,
    верхний ярус, ровная середина, без придыхания. Говорит полными фразами,
    медленно и точно, с паузами перед числами и юридическими терминами. В
    напряжении становится тише и вежливее. Юридическая манера без снобизма,
    усталость под контролем, минимум мелодики. Не играть «роковую женщину», не
    шептать, не добавлять материнское тепло.
  negative_prompt: >-
    Не играть «ледяную стерву», не добавлять роковой шёпот, не сюсюкать, не
    делать «доброго юриста», не превращать юридическую точность в робота, не
    повышать голос в панике, не всхлипывать перед смертью.

