summary: >-
  Ада выглядит как человек, который вошёл в комнату и уже знает, где здесь
  выход, где камера и где лежит нужная папка. Серое пальто, короткая стрижка,
  фильтр в серебряной рамке, перчатки, которые она снимает только перед
  бумагой. Она говорит ровно, полными фразами, и от этой ровности становится
  не легче, а страшнее. За её спокойствием стоит не холодность, а привычка
  считать: сколько стоит слово, сколько стоит копия, сколько стоит человек,
  который слишком много видел.

