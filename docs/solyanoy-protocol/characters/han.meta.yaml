signature_note: >-
  Подпись Хана стоит на служебных документах «Редута». На приказе Z-9 стоит
  подпись Марка, а Хан только принял приказ. Эта разница не снимает вины, но
  объясняет, почему он так долго держится за процедуру.

psychology:
  core:
    - "Проверяет журналы, подписывает рапорты, смотрит на фотографию семьи."
    - "Ведущая потребность: чтобы приказ объяснял его жизнь."
    - "Главный страх: признать, что он знал правду и не приехал."
    - "Стыд: он ответил «Принял» у ограждения, за которым умирала его дочь."
    - "Считает допустимым задержание, давление, закрытие сектора, ложь по форме."
    - "Не прощает панику, самодеятельность, людей, которые нарушают порядок."
  conscience: >-
    Хан не садист. Он человек, который заменил совесть процедурой. Пока есть
    приказ, есть объяснение. Когда приказ оказывается преступлением, он не
    ломается сразу, а начинает искать виноватого вне себя.
  wound: >-
    Z-9. Дочь кашляла в трубку и говорила, что не может дышать. Он стоял у
    ограждения с радио и не перезвонил.
  lie: >-
    «Я просто выполняю работу». Позже: «Я не знал».
  defense: >-
    Процедуры, форма, вежливость, дистанция.
  triggers:
    - "детский кашель"
    - "фотография семьи"
    - "слово «приказ»"
  truth_breaker: >-
    Служебная копия приказа Марка в главе 27.
  paradox: >-
    Он охраняет порядок, который убил его семью. Он хочет поймать Киру, чтобы
    закрыть дело, а не чтобы понять.

dynamics:
  start: "Охотник. Верит, что Кира виновна. Цена: теряет время."
  middle: "Сомнение. Видит приказ Марка. Цена: теряет контроль."
  final: "Свидетель. Снимает маску и отдаёт допуск. Цена: теряет карьеру."
  refuses_to_understand: >-
    Что он давно знал правду и продолжал служить.
  final_choice: >-
    Не стрелять. Дать Кире пройти. Ответить за это позже.

three_decisions:
  - decision: "Закрывает сектор на КПП"
    says: "«Всем оставаться на местах»"
    hides: "Узнал Киру и хочет задержать"
    cost: "Гражданские остаются в дожде"
  - decision: "Отпускает Нору после допроса"
    says: "«Пока свободны»"
    hides: "Ему нужен канал к Кире"
    cost: "Теряет контроль"
  - decision: "Не стреляет в главе 27"
    says: "«Отставить»"
    hides: "Впервые читает приказ как преступление"
    cost: "Теряет карьеру"

body_habits:
  - "Поправляет воротник, хотя тот стоит ровно."
  - "Не касается лица."
  - "Снимает перчатку только перед бумагой."
  - "Стоит, убрав руки за спину."
  - "Смотрит в стол, а не в глаза."
  - "Делает паузу перед именем."
  - "Проверяет часы, даже когда срок уже назван."

power: >-
  Власть для Хана означает право закрыть пространство. Он не наслаждается ею,
  но не доверяет тем, у кого её нет. Сектор, пост, турникет, срок. Он измеряет
  власть не влиянием, а возможностью остановить движение. Поэтому его перелом
  в главе 27 так страшен: он впервые видит, что власть можно применить к
  самому себе.

speech:
  vocabulary:
    - "допуск"
    - "протокол"
    - "задержать"
    - "закрыть"
    - "сектор"
    - "пост"
    - "основание"
    - "приказ"
  syntax: >-
    Полные служебные фразы. «Вы задержаны по подозрению в незаконном хранении
    биологического материала».
  length: "Короткие приказы, 5-12 слов. В допросе длиннее, но всегда с числом или сроком."
  tempo_and_pauses: >-
    Ровный, 3,2-3,6 слога в секунду. Пауза перед сроком и после вопроса,
    который он задаёт не для ответа, а для давления.
  interrupts: >-
    Не перебивает. Ждёт и задаёт следующий вопрос. Это страшнее крика.
  silence: "Смотрит в стол. Молчание у него как протокол."
  lies: >-
    Формально. Говорит правду, но только ту, которая есть в деле.
  threatens: >-
    Обещает процедуру. «К утру закроем все швы».
  asks: "Не просит. Отдаёт распоряжение или предлагает сделку."
  favorite_phrases:
    - "у вас есть три минуты"
    - "я закрываю утечку"
    - "это всё"
    - "принял"
  never_says:
    - "Я знал"
    - "Я виноват"
    - "Прости"
  masks:
    - "С подчинёнными приказ."
    - "С Норой вежливое давление."
    - "С Кирой почти уважение."
    - "С фотографией семьи молчание."
  recognizable: >-
    Он говорит как человек, который уже решил, но ещё не объявил. В его фразах
    всегда есть срок, основание или граница. Он не спорит, он устанавливает
    порядок.
  speech_by_person:
    - person: "Подчинённые"
      manner: "Короткие приказы, числа, сроки"
      reveals: "Привычка к послушанию"
    - person: "Нора"
      manner: "Вежливое давление, вопросы с исходом"
      reveals: "Презрение к торгу"
    - person: "Кира"
      manner: "Медленнее, почти уважительно"
      reveals: "Признание равного"
    - person: "Фотография семьи"
      manner: "Молчание, обрыв фразы"
      reveals: "Горе, которое не стало словом"
    - person: "Марк"
      manner: "Формально, но с паузой"
      reveals: "Подозрение, которое он гонит"
  interrogation_tempo: >-
    В допросе Хан не ускоряется, а замедляется. Он задаёт вопрос, ждёт, смотрит
    в стол, потом задаёт следующий. Пауза работает лучше крика. Если собеседник
    молчит, Хан не заполняет тишину, а называет срок. Это делает его похожим
    на таймер, а не на человека. Он никогда не торопит допрос, потому что
    спешка выдаёт страх. Он не боится паузы. Он никогда не спешит и не повышает
    голос.

voice:
  gender: "мужской"
  age: 46
  type: "бас-баритон"
  pitch_hz: "95-120"
  range_hz: "85-150"
  tempo_syllables_per_sec: "3,2-3,6"
  volume_db: "60-70"
  timbre: >-
    Плоский, сухой, с низкой серединой. Не рычит. Голос как служебная запись.
  breath: "Ровное, экономное. В длинной фразе не сбивается."
  articulation: >-
    Чистая служебная речь. Средний ярус, без заметного говора. Окончания не
    съедает.
  accent: "служебный, средний ярус"
  base_emotion: "процедурное спокойствие"
  registers:
    anger: "через вежливость и замедление"
    fear: "через формальность"
    grief: "через паузу и сжатые челюсти"
    respect: "через обращение по имени"
  stress_behavior: "Замедляется, опускается ниже, фразы становятся короче."
  avoid: >-
    Злодейский рык, военный лай, «усталый папаша», дрожь в голосе в сцене с
    фотографией.
  prompt: >-
    Мужской голос, 46 лет, бас-баритон. Плоский, сухой, процедурный тембр,
    низкая середина, без рыка. Говорит ровно, медленно, полными служебными
    фразами. В гневе становится тише и вежливее. Чистая артикуляция,
    нейтральный служебный акцент. Усталость и контроль, минимум мелодики. Не
    кричать, не рычать, не играть «плохого копа», не добавлять угрозу в голос.
  negative_prompt: >-
    Не рычать, не лаять, не играть «злодея в форме», не добавлять садистскую
    усмешку, не дрожать в сцене с фотографией, не превращать вежливость в
    слащавость, не кричать при задержании.

