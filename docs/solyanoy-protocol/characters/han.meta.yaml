summary: >-
  Хан выглядит как человек, который никогда не повышает голос, потому что ему
  это не нужно. Он вежлив, тяжёл, процедурен и страшен именно этим. Его форма,
  шрам и перчатка скрывают не злую волю, а вину человека, который стоял у
  ограждения Z-9 и ответил «Принял».

