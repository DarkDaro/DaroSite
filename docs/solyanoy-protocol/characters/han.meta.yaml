  - text: "Потом я задам вопросы, на которые вы не ответите"
    direction: "Сухо, почти буднично."
  - text: "Кира Данн. Вы задержаны по подозрению в незаконном хранении биологического материала"
    direction: "Полная служебная фраза, без злости."
  - text: "Я не охочусь за тобой. Я закрываю утечку"
    direction: "Тише, чем предыдущая фраза."
  - text: "Кто подписал приказ"
    direction: "Не вопрос, а последняя проверка."
  - text: "Я сказал, допрос окончен"
    direction: "Жёстко, но без крика."
  - text: "Тогда к утру закроем все швы"
    direction: "Пусто, как расписание."

