summary: >-
  Тэо выглядит как подросток, который слишком быстро говорит и слишком рано
  научился не доверять форме. Худой, с паяльником в руке и портом за ухом, он
  кажется легче, чем есть. На самом деле он держит на себе сеть, риск и память
  о двух братьях, которых «Редут» считает живыми.

