signature_note: >-
  Собственной подписи в деле нет. Тэо работает через чужие допуски и следы в
  сети. Его почерк остаётся в логах, а не на бумаге.

psychology:
  core:
    - "Разбирает мёртвый имплантат и собирает из него что-то работающее."
    - "Ведущая потребность: быть нужным. Не любимым, а нужным."
    - "Главный страх: что братья мертвы, а он остался жив и ничего не сделал."
    - "Стыд: он остался, когда старшие ушли. Теперь он доказывает, что не зря."
    - "Считает допустимым взлом, подделку допуска, риск для себя, обман формы."
    - "Не прощает равнодушие и людей, которые сдаются."
  third_path: >-
    Тэо вырос в системе, где детей учат не задавать вопросов, а взрослых учат не
    отвечать. Он выбрал третий путь: обходить систему технически. Его вера не в
    правду, а в работающую схему. Если схема открывает дверь, значит, она
    правильная.
  wound: >-
    Два старших брата ушли в «Редут» и не вернулись. В списке пропавших они
    есть, в базе «Редута» оба живы.
  lie: >-
    «Мне всё равно, живы они или нет. Мне нужны имена». На самом деле ему
    нужно, чтобы кто-то вернулся.
  defense: >-
    Скорость, ирония, компетентность. Пока он чинит, он не думает.
  triggers:
    - "слово «допуск»"
    - "форма «Редута»"
    - "чужая жалость"
  truth_breaker: >-
    Имя брата в служебной базе или тело в списке.
  paradox: >-
    Он собирает глушители, чтобы его не слышали, и делает всё, чтобы его
    заметили.

dynamics:
  start: "«Мне не нужен допуск. Мне нужен вход». Доказывает, что может. Цена: рискует собой."
  middle: "«Я держу линию». Берёт ответственность. Цена: повреждает кисть."
  final: "«Синяя строка держит». Доводит сброс до конца. Цена: остаётся без инструмента и без допуска."
  refuses_to_understand: >-
    Что братья могли быть частью системы, а не только её жертвами.
  final_choice: >-
    Запустить сброс, даже если рука уже не работает.

three_decisions:
  - decision: "Впускает Киру в подсобку"
    says: "«Заходи. И не трогай ничего руками»"
    hides: "Хочет услышать о братьях"
    cost: "Рискует убежищем"
  - decision: "Отдаёт пропуск у клиники"
    says: "«Не задерживайся у турникета»"
    hides: "Верит, что Кира вернётся"
    cost: "Рискует Верой"
  - decision: "Идёт на дамбу с ожогом"
    says: "«Я держу линию»"
    hides: "Боится не успеть"
    cost: "Повреждает кисть"

body_habits:
  - "Барабанит пальцами по столу в порядке, который знает только он."
  - "Вытирает руки о штаны перед тем, как взять чужую вещь."
  - "Слушает, наклонив голову к плечу."
  - "Проверяет порт за ухом, когда нервничает."
  - "Считает выходы, даже в знакомой комнате."
  - "Смеётся на выдохе, коротко и не всегда к месту."
  - "Держит паяльник как нож, даже когда не работает."

power: >-
  Он ненавидит допуски, потому что они решают, кому можно дышать. Уважает
  доступ, потому что его можно получить. Его власть не в должности, а в
  способности открыть дверь, которую считали закрытой.

speech:
  vocabulary:
    - "вход"
    - "допуск"
