  syntax: >-
    Короткие фразы, часто без подлежащего. «Чисто». «Тогда меньше». «Не
    помнишь».
  length: "3-10 слов. В объяснении схемы может говорить длинно, но всё равно с числами."
  tempo_and_pauses: >-
    Быстрый, 4,5-5,5 слога в секунду. Пауза перед числом и после вопроса,
    который он задаёт не для ответа.
  interrupts: >-
    Легко, по делу. Перебивает, чтобы успеть сказать до того, как собеседник
    сделает глупость.
  silence: "Щёлкает инструментом, смотрит в терминал. Молчание у него занятое."
  lies: >-
    Быстро и с деталями. Врёт так, будто объясняет схему.
  threatens: >-
    Не угрожает. Сообщает техническую возможность: «Я могу закрыть тебе канал».
  asks: "Не просит. Предлагает работу или сделку."
  favorite_phrases:
    - "Памяти мало"
    - "В сеть не лезь"
    - "Тогда меньше"
    - "Все так говорят"
  never_says:
    - "Я боюсь"
    - "Мне всё равно"
    - "Я тебя не брошу"
  masks:
    - "С Кирой быстрый инструктаж."
    - "С Норой торг."
    - "С Ханом предельная осторожность."
    - "С Ли уважение."
    - "С братьями в памяти длинные фразы."
  recognizable: >-
    Он говорит как техник, который уже видит схему и торопится объяснить её до
    аварии. В его речи много чисел, условий и коротких команд. Он не
    философствует. Даже страх у него выражается через время и допуск.
  speech_by_person:
    - person: "Кира"
      manner: "Быстрый инструктаж, «ты», числа"
      reveals: "Признаёт за равную"
    - person: "Нора"
      manner: "Торг, короткие шутки"
      reveals: "Рабочая близость"
    - person: "Хан"
      manner: "Предельная осторожность, без шуток"
      reveals: "Страх"
    - person: "Ли"
      manner: "Тише, уважительнее"
      reveals: "Доверие к убежищу"
    - person: "Братья в памяти"
      manner: "Длинные фразы, без техники"
      reveals: "Горе, которое он прячет"
    - person: "Под давлением"
      manner: "Ещё быстрее, потом обрыв"
      reveals: "Паника, которую он контролирует"

voice:
  gender: "мужской"
  age: 19
  type: "тенор"
  pitch_hz: "130-160"
  range_hz: "110-200"
  tempo_syllables_per_sec: "4,5-5,5"
  volume_db: "60-70"
  timbre: >-
    Светлый, чуть носовой, с сухой серединой. Не «мультяшный». В стрессе
    появляется хрип.
  breath: "Короткое, частое. Он говорит на остатке выдоха, будто торопится."
  articulation: >-
    Нижний ярус, съеденные окончания, быстрый ритм. Технические слова
    произносит чисто, бытовые глотает.
  accent: "нижний ярус"
  base_emotion: "ирония и готовность работать"
  registers:
    anger: "быстрый и колкий"
    fear: "через ускорение и технические детали"
    grief: "через паузу и смену темы"
    tenderness: "через действие"
  stress_behavior: >-
    Ускоряется, потом ломается на середине фразы. После этого становится тише.
  avoid: >-
    Мультяшный «ботаник», визгливая паника, подростковый сленг ради сленга,
    слишком взрослый тембр.
  prompt: >-
    Мужской голос, 19 лет, тенор. Светлый, чуть носовой тембр, сухая середина,
    быстрый ритм. Говорит короткими техническими фразами, часто на остатке
    выдоха. Нижний ярус, съеденные окончания, технические слова чисто. Ирония и
    усталость, страх через ускорение, не через крик. Не играть «мультяшного
    хакера», не визжать, не добавлять взрослую тяжесть.
  negative_prompt: >-
    Не визжать, не играть «ботаника», не добавлять мультяшную шепелявость, не
    превращать сленг в комедию, не делать детский голос, не добавлять взрослую
    хриплость, не паниковать на высоких нотах.

