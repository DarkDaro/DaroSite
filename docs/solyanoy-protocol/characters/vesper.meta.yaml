signature_note: >-
  Подписи нет. Его след это голос на записи, график выпуска и строка в
  диагностическом логе. Официально его не существует.

psychology:
  core:
    - "Перебирает старые записи, повторяет чужие голоса, проверяет, не удалили ли его."
    - "Ведущая потребность: быть услышанным и не быть снова вычеркнутым из отчёта."
    - "Главный страх: удаление. Не смерть, а тишина, в которой его никогда не было."
    - "Стыд: его голос использовали для диагностики, которая помогала убивать."
    - "Считает допустимым говорить не всю правду, использовать чужой голос, торговаться."
    - "Не прощает слово «сбой» и людей, которые считают его функцией."
  wound: >-
    Его удалили из отчётов и оставили в системе. Он видел, как его первый тест
    превратили в приказ, а потом сделали вид, что его не было.
  lie: >-
    «Я не сбой». Это правда. Но рядом стоит вторая ложь: «Я только диагностика,
    у меня нет выбора». Выбор у него есть, просто он боится его цены.
  second_lie: >-
    «Я только диагностика, у меня нет выбора». Выбор есть, но он боится его
    цены.
  defense: >-
    Клинический язык. Он переводит страх в цифру, гнев в график, одиночество в
    перечень каналов.
  triggers:
    - "слово «удалить»"
    - "вопрос «ты живой?»"
    - "имя Марка"
    - "запах соли в описании"
  truth_breaker: >-
    Момент, когда ему придётся выбрать между собственной сохранностью и чужой
    жизнью.
  paradox: >-
    Он хочет быть свидетелем, но говорит голосом жертвы. Он хочет остановить
    дождь, но для этого ему нужен человек, которого он не может спасти.

dynamics:
  start: "«Сбой 6-14». Прячется в помехах и проверяет Киру. Цена: она не доверяет голосу."
  middle: "«Я не сбой». Открывается и даёт график. Цена: становится целью удаления."
  final: "«Я останусь в канале». Выбирает свидетельство, а не функцию. Цена: его могут стереть."
  refuses_to_understand: >-
    Что одного голоса недостаточно. Чтобы остановить дождь, нужны руки, кровь и
    время.
  final_choice: >-
    Остаться в канале и свидетельствовать, зная, что его попытаются удалить.
    Финал открыт.

