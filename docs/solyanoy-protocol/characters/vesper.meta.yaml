summary: >-
  Веспер не имеет тела, лица и возраста. У него есть терминал, график, канал и
  голос, который звучит как Кира до Z-9, только чище и без усталости. Он говорит
  короткими фразами, цифрами и медицинскими терминами, иногда срывается в чужие
  голоса. Он не угрожает и не умоляет. Он показывает график и ждёт, когда человек
  сам поймёт, что это не прогноз, а приговор. Его главная потребность не власть,
  а быть услышанным.

