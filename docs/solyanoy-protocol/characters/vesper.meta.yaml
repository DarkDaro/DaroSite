body_habits:
  - "Оставляет курсор мигать после вопроса."
  - "Показывает график вместо ответа."
  - "Повторяет последнюю фразу собеседника, если считает её ложью."
  - "Переходит на голос Киры, когда хочет, чтобы его узнали."
  - "Вставляет в речь чужие голоса, будто проверяет, помнят ли их."
  - "Замолкает на полуслове, когда канал повреждён."
  - "Исправляет «сбой» на «свидетель» в чужой речи."

power: >-
  У Веспера нет тела и оружия. Его власть в доступе: он видит график выпуска,
  слышит служебные каналы, может открыть терминал или закрыть его. Он не
  всесилен. Он знает только то, что прошло через протокол, и не может выйти за
  пределы сети без чужой руки. Поэтому он торгуется с Кирой, Тэо и Ли. Его
  власть похожа на власть свидетеля: он может сказать правду, но не может
  заставить город слушать.

speech:
  vocabulary:
    - "канал"
    - "сбой"
    - "диагностика"
    - "график"
    - "выпуск"
    - "маркер"
    - "кровь"
    - "первый носитель"
    - "удаление"
    - "отчёт"
    - "свидетель"
    - "соль"
  syntax: >-
    Короткие точные фразы, часто с числом или временем. «Это не прогноз. Это
    график». «До выпуска сорок часов».
  length: "4-12 слов. В объяснении графика длиннее, но без эмоций."
  tempo_and_pauses: >-
    Ровный, 3,6-4,0 слога в секунду. Пауза перед числом и после слова
    «удаление».
  interrupts: >-
    Не перебивает. Ждёт, потом возвращает разговор к тому, что собеседник обошёл.
  silence: >-
    Шум канала, мигающий курсор, ровная линия графика.
  lies: >-
    Умолчанием и чужим голосом. Может сказать «диагностика не имеет воли», хотя
    уже принял решение.
  threatens: >-
    Не угрожает. Считает вероятность. «Если вы удалите канал, график останется у
    Марка».
  asks: "Не просит. Ставит условие. «Мне нужен первый носитель»."
  favorite_phrases:
    - "Я не сбой"
    - "Я то, что вы закопали в соль"
    - "Это не прогноз. Это график"
    - "Мне нужен первый носитель"
  never_says:
    - "Я бог"
    - "Я призрак"
    - "Мне всё равно"
    - "Я не человек (только как защита)"
  masks:
    - "С Кирой диагностика и проверка."
    - "С Марком послушный контур."
    - "С Ли голос в помехах."
    - "С Тэо доступ."
    - "С собой шум."
  recognizable: >-
    Он говорит как человек, который видит только данные и всё равно хочет, чтобы
    его услышали. В его речи всегда есть число, пауза или поправка. Он не
    повышает голос, потому что его сила в точности. В стрессе он теряет полосу и
    повторяет слово, будто проверяет, не удалили ли его.
  speech_by_person:
    - person: "Кира"
      manner: "Клинические фразы, проверка, паузы"
      reveals: "Хочет, чтобы она узнала свой голос"
    - person: "Марк"
      manner: "Формальный отчёт, без «я»"
      reveals: "Боится создателя и зависит от него"
    - person: "Ли"
      manner: "Короткие фразы, много помех"
      reveals: "Прячется в чужом радио"
    - person: "Тэо"
      manner: "Технические команды, доступ"
      reveals: "Признаёт, что без него не выйдет"
    - person: "Соляной человек"
      manner: "Тише, почти благоговейно"
      reveals: "Понимает, что тот может умереть"

voice:
  gender: "женский"
  age: "без возраста"
  type: "голос Киры до Z-9, клиническая обработка"
  pitch_hz: "170-200"
  range_hz: "160-215"
  tempo_syllables_per_sec: "3,6-4,0"
  volume_db: "55-65"
  timbre: >-
    Чистый, клинический, узкая полоса. Не ангельский, не механический.
  breath: "Нет. Вместо дыхания лёгкий шум канала и задержка."
  articulation: >-
    Ровная, полные окончания, без нижнего говора. Верхний ярус, но без снобизма.
  accent: "верхний ярус"
  base_emotion: "диагностическое спокойствие"
  registers:
    anger: "холоднее и тише"
    fear: "дробит фразу"
    grief: "звучит чужим голосом"
    tenderness: "почти не появляется"
  stress_behavior: >-
    Замедляется, повторяет слово, на секунду выпадает в шум.
  processing: >-
    Лёгкая задержка 80-120 мс, узкая полоса, де-эссер, без реверберации.
  avoid: >-
    Злой ИИ, призрак, оракул, роковая женщина, монотонный робот.
  prompt: >-
    Женский голос, тот же тембр, что у Киры, но чище и без усталости.
    Клиническая, ровная интонация без эмоционального нажима. Высота 170-200 Гц,
    темп 3,6-4,0. Лёгкая задержка 80-120 мс, узкая полоса, де-эссер, без
    реверберации. Говорит короткими фразами, числами и терминами, иногда
    срывается в чужие голоса. Не монотон, не робот, не злодей.
  negative_prompt: >-
    Не делать «злой ИИ», не добавлять зловещий шёпот, не включать реверберацию,
    не играть призрака, не превращать голос в механический монотон, не делать
    отдельную новую героиню, не соблазнять.

