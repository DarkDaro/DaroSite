# Автодеплой на GitHub Pages с гейтами: проверка ломает деплой
# ДО публикации — битое не доезжает до читателя.
#
# Сайт без сборщика и лежит в корне репо, поэтому публикация —
# чистая копия в out/ с явным списком исключений: служебное
# (tools/, scripts/, rules/, метафайлы, конфиги песочницы) на прод
# не уезжает — см. rules/no-traces.md, раздел «Деплой».

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Гейт — внутренние ссылки, якоря, картинки
        run: node scripts/check-links.mjs . --base /DaroSite/

      - name: Гейт — тексты без слопа и следов генерации
        run: python3 scripts/check-slop.py . --ignore tools

      - name: Чистая копия для публикации
        run: |
          mkdir out
          rsync -a . out/ \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude 'tools' \
            --exclude 'scripts' \
            --exclude 'rules' \
            --exclude '*.md' \
            --exclude 'package.json' \
            --exclude 'opencode.json' \
            --exclude 'out'
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
