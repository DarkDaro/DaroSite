<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена / Соляной протокол</title>
<meta name="description" content="В архиве Кассия нет такого адреса. Вернуться к книге, карте или содержанию.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c0c">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0c;
    --panel: #111414;
    --ink: #e7e2d6;
    --muted: #8d918d;
    --accent: #d2a05c;
    --line: rgba(210, 160, 92, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(circle at 70% 20%, rgba(79, 232, 255, .08), transparent 34rem),
      radial-gradient(circle at 20% 80%, rgba(255, 61, 154, .06), transparent 30rem),
      var(--bg);
    color: var(--ink);
    font: 16px/1.65 "Segoe UI", system-ui, sans-serif;
  }
  main {
    width: min(760px, calc(100% - 40px));
    margin: 0 auto;
    padding: 12vh 0 8vh;
  }
  .meta, .seam, .links a {
    font: 12px/1.5 "Cascadia Mono", Consolas, monospace;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  .meta { color: var(--accent); }
  h1 {
    margin: 22px 0 18px;
    font-size: clamp(38px, 8vw, 82px);
    line-height: .96;
    font-weight: 600;
    letter-spacing: -.04em;
  }
  p { max-width: 58ch; color: var(--muted); }
  .code {
    margin: 28px 0;
    padding: 18px 20px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 13px/1.6 "Cascadia Mono", Consolas, monospace;
    overflow-wrap: anywhere;
  }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
  .links a {
    display: inline-flex;
    min-height: 44px;
    align-items: center;
    padding: 10px 16px;
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
  }
  .links a:first-child { border-color: var(--accent); color: var(--accent); }
  .links a:hover, .links a:focus-visible { border-color: var(--accent); outline: none; }
  .seam { margin-top: 46px; color: #6f736f; }
  .skip-link {
    position: absolute;
    left: -999px;
    top: 0;
    z-index: 10;
    padding: 10px 14px;
    background: var(--accent);
    color: #0b0c0c;
    font: 13px/1.4 "Cascadia Mono", Consolas, monospace;
  }
  .skip-link:focus { left: 12px; top: 12px; }
</style>
</head>
<body data-page="404">
<a class="skip-link" href="#main">Перейти к содержанию</a>
<main id="main" tabindex="-1">
  <p class="meta">Архив Кассия / ошибка 404</p>
  <h1>Страница не найдена</h1>
  <p>В архиве нет такого адреса. Документ мог быть изъят, перемещён или никогда не существовал.</p>
  <div class="code">GET /DaroSite/неизвестный-адрес → 404</div>
  <nav class="links" aria-label="Куда вернуться">
    <a href="/DaroSite/">Вернуться в архив</a>
    <a href="/DaroSite/book.html">К книге</a>
    <a href="/DaroSite/locations.html">К локациям</a>
    <a href="/DaroSite/world.html">К миру</a>
  </nav>
  <p class="seam">Даже у ошибки есть ярус.</p>
</main>
</body>
</html>
